services:
  # ==============================================================================
  # 1. FastAPI Backend (Render Web Service)
  # ==============================================================================
  - type: web
    name: asid-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: PERSIST_STATE
        value: "true"
      # Optional: Set your Gemini API Key if you want Gemini features enabled
      # - key: GEMINI_API_KEY
      #   sync: false

  # ==============================================================================
  # 2. React / Vite Frontend (Render Static Site)
  # ==============================================================================
  - type: web
    name: asid-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # Single Page App rewrite rule for React Router
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: asid-backend
          property: host
